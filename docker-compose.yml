services:
  app:
    # Published multi-arch image. Override FT_IMAGE to use your own registry,
    # or run `docker compose up -d --build` to build Containerfile locally.
    image: ${FT_IMAGE:-ghcr.io/smurfpandey/familytree:latest}
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "8088:80"
    # Every setting is optional: the defaults suit one family on one host.
    # Uncomment what you need. There is no .env file.
    # environment:
    #   APP_DOMAIN: family.example.com
    #   APP_URL: https://family.example.com
    #   APP_TENANT_ID: 00000000-0000-0000-0000-000000000000
    #   MAIL_FROM_NAME: FamilyTree
    #   MAIL_FROM_EMAIL: noreply@family.example.com
    #   SMTP_HOST: smtp.example.com
    #   SMTP_PORT: 587
    #   SMTP_SECURE: tls          # tls (STARTTLS), ssl (implicit TLS) or none
    #   SMTP_USER: postmaster@example.com
    #   SMTP_PASS: your-password
    #   FT_TREE_STORAGE_MB: "1024"
    #   CRON_KEY: change-me
    volumes:
      - ./public_html:/var/www/html
      - uploads:/var/www/html/admin/uploads
      - storage:/var/www/html/storage
volumes:
  uploads:
  storage:
